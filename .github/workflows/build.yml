name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Extract project
        run: unzip -q app.zip
      - name: Locate project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
      - name: Build APK
        run: |
          cd ${{ steps.locate.outputs.dir }}
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app-debug.apk'
